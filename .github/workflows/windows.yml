# Windows build: engine runtime (CPython + PyTorch CPU + ffmpeg), the NSIS installer, and an
# end-to-end test of the real app (first-run install from a local asset server, then a full
# transcription). Outputs are uploaded as workflow artifacts; publishing them to the GitHub
# releases is a separate step: .github/workflows/windows-publish.yml (see docs/RELEASING.md).
name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [windows-build]
    paths-ignore: [.github/windows-publish.json, .github/workflows/windows-publish.yml]

permissions:
  contents: read

env:
  ASSETS_TAG: assets-2026.11.1

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache build downloads (CPython, ffmpeg)
        uses: actions/cache@v4
        with:
          path: release/build/cache
          key: win-build-cache-${{ hashFiles('release/build_runtime_windows.py') }}

      - name: Build the engine runtime
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python release/build_runtime_windows.py --tag $env:ASSETS_TAG

      - name: Fetch the AI models from the assets release (for the end-to-end test)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release download $env:ASSETS_TAG --repo ${{ github.repository }} --dir release/out/$env:ASSETS_TAG
          --pattern "beat_this--*" --pattern "open_fret--*" --pattern "tab_labeler--*" --pattern "tsumugi--*"

      - name: Build the app (NSIS installer)
        run: |
          npm ci --prefix frontend
          npm ci --prefix desktop
          npm run dist:win --prefix desktop

      - name: End-to-end test (install engine + models, transcribe a recording)
        shell: pwsh
        run: |
          $server = Start-Process python -ArgumentList "release/serve_local.py", $env:ASSETS_TAG -PassThru -NoNewWindow `
            -RedirectStandardOutput serve.log -RedirectStandardError serve.err.log
          Start-Sleep -Seconds 3
          node release/e2e_test.js --app desktop/dist/win-unpacked/Tabscribe.exe --audio bench/YeuEm.wav --out e2e --toggle bs_roformer_sw
          $code = $LASTEXITCODE
          Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          exit $code

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: tabscribe-windows-installer
          path: |
            desktop/dist/Tabscribe-Setup-*.exe
            desktop/manifest-win32-x64.json

      - name: Upload engine runtime
        uses: actions/upload-artifact@v4
        with:
          name: tabscribe-windows-runtime
          path: release/out/${{ env.ASSETS_TAG }}/tabscribe-runtime-windows-x64.tar.gz*
          compression-level: 0

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/*.json
            e2e/*.png
            e2e/*.log
            e2e/data/logs/
            serve*.log
