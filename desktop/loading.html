<!doctype html>
<html><head><meta charset="utf-8"><title>Tabscribe</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e0e10; color: #ededee; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-app-region: drag; }
  .c { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  .name { font-weight: 600; font-size: 17px; letter-spacing: -.2px; }
  .m { color: #9a9aa0; font-size: 13px; }
  /* the frets drift left and right like a waveform while the engine starts */
  .fret { animation: drift 1.6s ease-in-out infinite alternate; }
  .fret:nth-child(2) { animation-delay: -.3s } .fret:nth-child(3) { animation-delay: -.6s }
  .fret:nth-child(4) { animation-delay: -.9s } .fret:nth-child(5) { animation-delay: -1.2s }
  @keyframes drift { from { transform: translateX(-1.6px) } to { transform: translateX(1.6px) } }
</style></head>
<body><div class="c">
  <svg width="64" height="64" viewBox="0 0 32 32"><defs><linearGradient id="tsg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#19c08f"/><stop offset="1" stop-color="#0a7c62"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#tsg)"/><rect x="11" y="3" width="10" height="26" rx="1.5" fill="#000" fill-opacity=".2"/><g stroke="#fff" stroke-opacity=".35" stroke-width=".6"><path d="M12.2 3v26M13.72 3v26M15.24 3v26M16.76 3v26M18.28 3v26M19.8 3v26"/></g><g fill="#fff"><rect class="fret" x="9" y="6.25" width="10.5" height="2.5" rx="1.25"/><rect class="fret" x="12.5" y="10.75" width="12.5" height="2.5" rx="1.25"/><rect class="fret" x="7" y="15.25" width="15.5" height="2.5" rx="1.25"/><rect class="fret" x="11" y="19.75" width="13" height="2.5" rx="1.25"/><rect class="fret" x="10" y="24.25" width="10" height="2.5" rx="1.25"/></g></svg>
  <div class="name">tabscribe</div>
  <div class="m">Starting the local transcription engine…</div>
</div></body></html>
